name: Run qualification on branch

on:
  push:
    branches-ignore:
      - main

jobs:
  lint-fmt:
    name: Lint & Fmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
    
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.3

      - name: Install Task
        # TODO: Pin this action to a commit SHA for security
        # Visit https://github.com/go-task/setup-task/releases to find the real hash for v1
        uses: go-task/setup-task@v1  # SECURITY: Should be pinned to commit SHA

      - name: Install golangci-lint
        # TODO: Pin this action to a commit SHA for security
        # Visit https://github.com/golangci/golangci-lint-action/releases to find the real hash for v9
        uses: golangci/golangci-lint-action@v9  # SECURITY: Should be pinned to commit SHA
        with:
          version: v2.6.2
          install-mode: binary
          install-only: true

      - name: Lint
        run: task lint

      - name: Format
        if: always()
        run: task fmt

  unittest:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
    
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.3

      - name: Install Task
        # TODO: Pin this action to a commit SHA for security
        # Visit https://github.com/go-task/setup-task/releases to find the real hash for v1
        uses: go-task/setup-task@v1  # SECURITY: Should be pinned to commit SHA

      - name: Install mockgen
        run: task install-mockgen

      - name: Generate main dagger code
        # TODO: Pin this action to a commit SHA for security
        # Visit https://github.com/dagger/dagger-for-github/releases to find the real hash for v8.2.0
        uses: dagger/dagger-for-github@v8.2.0  # SECURITY: Should be pinned to commit SHA
        with:
            verb: develop
            args: --sdk=go --compat=skip
            version: "v0.19.6"

      - name: Generate workspace dagger code
        # TODO: Pin this action to a commit SHA for security
        # Visit https://github.com/dagger/dagger-for-github/releases to find the real hash for v8.2.0
        uses: dagger/dagger-for-github@v8.2.0  # SECURITY: Should be pinned to commit SHA
        with:
            workdir: workspace
            verb: develop
            args: --sdk=go --compat=skip
            version: "v0.19.6"

      - name: Generate mocks
        run: task mocks

      - name: Run tests with task
        run: task unit-tests

  security:
    name: Security checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
    
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.3

      # use go install and run task, does not seem to properly exclude generated dagger code
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Install Task
        # TODO: Pin this action to a commit SHA for security
        # Visit https://github.com/go-task/setup-task/releases to find the real hash for v1
        uses: go-task/setup-task@v1  # SECURITY: Should be pinned to commit SHA

      - name: Install mockgen
        run: task install-mockgen

      - name: Generate main dagger code
        # TODO: Pin this action to a commit SHA for security
        # Visit https://github.com/dagger/dagger-for-github/releases to find the real hash for v8.2.0
        uses: dagger/dagger-for-github@v8.2.0  # SECURITY: Should be pinned to commit SHA
        with:
            verb: develop
            args: --sdk=go --compat=skip
            version: "v0.19.6"

      - name: Generate workspace dagger code
        # TODO: Pin this action to a commit SHA for security
        # Visit https://github.com/dagger/dagger-for-github/releases to find the real hash for v8.2.0
        uses: dagger/dagger-for-github@v8.2.0  # SECURITY: Should be pinned to commit SHA
        with:
            workdir: workspace
            verb: develop
            args: --sdk=go --compat=skip
            version: "v0.19.6"

      - name: Generate mocks
        run: task mocks

      - name: Run gosec
        run: task gosec
