name: Vulnerable Workflow for Testing

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4  # Updated to latest version
      
      - name: Print PR title (Input Sanitized)
        run: |
          if [ -n "$PR_TITLE" ]; then echo "PR Title: $PR_TITLE"; fi
          if [ -n "$PR_BRANCH" ]; then echo "Branch: $PR_BRANCH"; fi
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
      
      - name: Setup without hardcoded secret
        env:
          # API_KEY removed. Use secret instead.
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "Using API key..."
      
      - name: Run tests
        run: |
          npm test
