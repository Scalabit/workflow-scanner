name: Vulnerable Workflow for Testing

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:                        # Added minimal permissions
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4      # Updated to latest stable version
      
      - name: Print PR title (Sanitized)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "PR Title: ${PR_TITLE//[^a-zA-Z0-9 ._-]/}"
          echo "Branch: ${PR_BRANCH//[^a-zA-Z0-9._-]/}"
      
      - name: Setup with secret from Actions secrets  # Removed hardcoded secret
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "Using API key..."
      
      - name: Run tests
        run: |
          npm test
