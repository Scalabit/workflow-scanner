name: Vulnerable Workflow for Testing

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4  # Fixed outdated version
      
      - name: Print PR title (Script Injection Mitigated)
        run: |
          # The following input is sanitized to prevent script injection
          echo "PR Title: $(echo "$PR_TITLE" | sed 's/[^a-zA-Z0-9 _-]//g')"
          echo "Branch: $(echo "$BRANCH" | sed 's/[^a-zA-Z0-9 _\/-]//g')"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
      
      - name: Setup with API key from secrets (Was hardcoded)
        env:
          # Previous hardcoded API_KEY was replaced with a secret reference
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "Using API key..."
      
      - name: Run tests
        run: |
          npm test
