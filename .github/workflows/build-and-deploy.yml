name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          persist-credentials: false
      
      - name: Authenticate to Google Cloud
        # TODO: Pin to commit SHA - visit https://github.com/google-github-actions/auth/releases to get the real hash for v2
        uses: google-github-actions/auth@v2

      - name: Setup Google Cloud SDK
        # TODO: Pin to commit SHA - visit https://github.com/google-github-actions/setup-gcloud/releases to get the real hash for v2
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Push Docker Image
        # TODO: Pin to commit SHA - visit https://github.com/docker/login-action/releases to get the real hash for v3
        uses: docker/login-action@v3
