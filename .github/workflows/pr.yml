name: Verify semver

on:
  pull_request:

jobs:
  check:
    name: Check semver exists
    runs-on: ubuntu-latest
    steps:
    - name: Verify semver label exists
      run: |
        labels="$(gh api repos/$OWNER/$REPO_NAME/pulls/$PULL_REQUEST_NUMBER --jq '.labels.[].name')"
        semver=$(echo "${labels}" | grep -Po "semver-(major|minor|patch)")
        if ! [[ "$(echo ${semver} | wc -l)" -eq 1 ]]; then
            echo "Bad number of semver labels given: ${semver}"
            return 1
        fi