name: Test Workflow Scanner

on:
  workflow_dispatch:

jobs:
  test-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # TODO: Pin this action to a commit SHA - visit https://github.com/Scalabit/workflow-scanner/releases to find the hash
      - name: Run workflow scanner
        id: scanner
        uses: Scalabit/workflow-scanner@v1
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          llm-api-key: ${{ secrets.OPENAI_API_KEY }}
