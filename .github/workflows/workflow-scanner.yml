name: Test Workflow Scanner

on:
  push:
    branches:
      - improve-pr

jobs:
  test-scanner:
    if: ${{ !contains(github.event.pull_request.title, 'Security Audit & Fixes for GitHub Actions Workflows') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run workflow scanner
        id: scanner
        uses: Scalabit/workflow-scanner-action@other-repos 
        with:
          api-token: ${{ secrets.FS_API_TOKEN }}
          github-token: ${{ secrets.GH_PAT }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          target-branch: main
