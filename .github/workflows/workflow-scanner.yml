name: Workflow Scanner

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  test-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Docker Login
        # TODO: Pin this action to a commit SHA for security
        # Visit https://github.com/docker/login-action/releases to find the real hash for v3
        uses: docker/login-action@v3

      - name: Run Workflow Scanner
        # TODO: Pin this action to a commit SHA for security
        # Visit https://github.com/Scalabit/workflow-scanner-action/releases to find the real hash for other-repos
        uses: Scalabit/workflow-scanner-action@other-repos
