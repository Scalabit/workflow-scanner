name: Workflow Scanner

on:
  push:
    branches:
      - '**'

jobs:
  test-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          persist-credentials: false

      # TODO: Pin to commit SHA - visit https://github.com/docker/login-action/releases to get the real hash
      uses: docker/login-action@v3  # SECURITY: Should be pinned to commit SHA

      # TODO: Pin to commit SHA - visit https://github.com/Scalabit/workflow-scanner-action/releases to get the real hash
      uses: Scalabit/workflow-scanner-action@other-repos  # SECURITY: Should be pinned to commit SHA
