name: Test Workflow Scanner

on:
  pull_request:

jobs:
  test-scanner:
    if: ${{ !contains(github.event.pull_request.title, 'Security Audit & Fixes for GitHub Actions Workflows') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run workflow scanner
        id: scanner
        uses: Scalabit/workflow-scanner-action@7e2fcef8f62f188b19d823d3b30bc706f2bba234 # master
        with:
          api-token: ${{ secrets.FS_API_TOKEN }}
          github-token: ${{ secrets.TEST_GH_TOKEN }}
          llm-api-key: ${{ secrets.OPENAI_API_KEY }}
          #repository: 'goncalogdomingo/test1'
      
      - name: Validate AI Pull Request 
        if: ${{ steps.scanner.outcome == 'success' }}
        id: validate_pr
        env:
          EXPECTED_PR_TITLE: 'Security Audit & Fixes for GitHub Actions Workflows'
          EXPECTED_DESC_TITLE: 'Complete Security Audit Report'
          #REPO: 'Scalabit/integration-test-workflow-scanner'
          #REPO: 'goncalogdomingo/test1'
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.TEST_GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Querying GitHub for most-recent open PRs..."
          resp=$(curl -s -H "Authorization: token ${TOKEN}" \
            "https://api.github.com/repos/${REPO}/pulls?state=open&sort=created&direction=desc&per_page=1")

          pr_number=$(echo "$resp" | jq -r '.[]? | .number' | head -n1)
          if [ -z "$pr_number" ]; then
            echo "No open PRs found"
            exit 1
          fi

          pr_title=$(echo "$resp" | jq -r '.[]? | .title' | head -n1 | sed -e 's/^[[:space:]]*//;s/[[:space:]]*$//')
          pr_body=$(echo "$resp" | jq -r '.[]? | .body' | head -n1)
          pr_firstline=$(echo "$pr_body" | sed -n '1p' | sed -e 's/^[[:space:]]*//;s/[[:space:]]*$//')

          echo "Found open PR #${pr_number} - title='${pr_title}' firstline='${pr_firstline}'"
          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"

          if [ "$pr_title" = "$EXPECTED_PR_TITLE" ] || [ "$pr_firstline" = "$EXPECTED_DESC_TITLE" ]; then
            echo "PR matches expected markers"
            exit 0
          fi

          echo "Open PR from test repo does not match expected title/description"
          exit 1

      - name: Close AI Pull Request
        if: ${{ steps.validate_pr.outcome == 'success' }}
        env:
          TOKEN: ${{ secrets.TEST_GH_TOKEN }}
          #REPO: 'Scalabit/integration-test-workflow-scanner'
          #REPO: 'goncalogdomingo/test1'
          REPO: ${{ github.repository }}
          STEPS_VALIDATE_PR_OUTPUTS_PR_NUMBER: ${{ steps.validate_pr.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail

          pr_number="${STEPS_VALIDATE_PR_OUTPUTS_PR_NUMBER}"
          if [ -z "$pr_number" ]; then
            echo "No PR number available to close"
            exit 1
          fi

          echo "Closing PR #${pr_number}"
          patch_resp=$(curl -s -X PATCH -H "Authorization: token ${TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls/${pr_number}" -d '{"state":"closed"}')

          closed_state=$(echo "$patch_resp" | jq -r '.state // empty')
          if [ "$closed_state" = "closed" ]; then
            echo "PR #${pr_number} closed"
            exit 0
          fi

          echo "Failed to close PR #${pr_number}"
          echo "$patch_resp"
          exit 1
