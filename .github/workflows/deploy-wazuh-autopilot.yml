name: Deploy Wazuh OpenClaw Autopilot

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: string
      gcp_zone:
        description: 'GCP Zone'
        required: true
        type: string

  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
        - production

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GCP_ZONE: ${{ inputs.gcp_zone || secrets.GCP_ZONE }}

jobs:
  deploy:
    name: Deploy Autopilot to GCP VM
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Create deployment script
      run: |
        cat > deploy.sh << 'EOF'
        #!/bin/bash
        set -e
        
        echo "Starting fresh OpenClaw Autopilot deployment..."
        
        # Clean up any previous installations
        echo "Cleaning up previous installations..."
        sudo systemctl stop wazuh-mcp-server 2>/dev/null || true
        sudo systemctl stop wazuh-autopilot 2>/dev/null || true
        sudo systemctl disable wazuh-mcp-server 2>/dev/null || true
        sudo systemctl disable wazuh-autopilot 2>/dev/null || true
        sudo rm -f /etc/systemd/system/wazuh-mcp-server.service
        sudo rm -f /etc/systemd/system/wazuh-autopilot.service
        sudo rm -rf /opt/wazuh-mcp-server
        sudo rm -rf /opt/openclaw-autopilot
        sudo systemctl daemon-reload
        
        echo "Installing Ollama..."
        if ! command -v ollama &> /dev/null; then
          curl -fsSL https://ollama.com/install.sh | sh
          sudo mkdir -p /etc/systemd/system/ollama.service.d/
          sudo tee /etc/systemd/system/ollama.service.d/override.conf > /dev/null << 'OLLAMA_CONF'
        [Service]
        Environment="OLLAMA_NUM_CTX=32768"
        Environment="OLLAMA_HOST=0.0.0.0"
        Environment="OLLAMA_KEEP_ALIVE=24h"
        Environment="OLLAMA_FLASH_ATTENTION=1"
        Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
        OLLAMA_CONF
          sudo systemctl daemon-reload
          sudo systemctl enable ollama
          sudo systemctl start ollama
          sleep 10
          ollama pull llama3.2:3b
        fi

        echo "Waiting for background apt processes to finish..."
        while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || sudo fuser /var/lib/dpkg/lock >/dev/null 2>&1; do
          echo "Waiting for dpkg lock to be released..."
          sleep 5
        done

        echo "Installing Python and pip..."
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -yq python3 python3-pip
        
        echo "Installing MCP Server..."
        if [ ! -d "/opt/wazuh-mcp-server" ]; then
          echo "Cloning MCP Server repository..."
          cd /opt
          if ! sudo git clone https://github.com/gensecaihq/Wazuh-MCP-Server wazuh-mcp-server; then
            echo "ERROR: Failed to clone MCP Server repository"
            exit 1
          fi
          
          cd wazuh-mcp-server
          echo "Installing Python dependencies..."
          if ! sudo pip3 install -r requirements.txt; then
            echo "ERROR: Failed to install Python dependencies"
            echo "Contents of requirements.txt:"
            cat requirements.txt
            exit 1
          fi
          
          echo "Creating systemd service file..."
          sudo tee /etc/systemd/system/wazuh-mcp-server.service > /dev/null << 'MCP_SERVICE'
        [Unit]
        Description=Wazuh MCP Server
        After=network.target wazuh-manager.service ollama.service
        
        [Service]
        Type=simple
        User=root
        WorkingDirectory=/opt/wazuh-mcp-server
        Environment=WAZUH_HOST=localhost
        Environment=WAZUH_PORT=55000
        Environment=WAZUH_USER=wazuh
        Environment=WAZUH_VERIFY_SSL=false
        Environment=MCP_PORT=3000
        Environment=MCP_HOST=0.0.0.0
        Environment=AUTH_MODE=bearer
        Environment=MCP_API_KEY=${MCP_API_KEY}
        ExecStart=/usr/bin/python3 -m src.main
        Restart=always
        RestartSec=10
        
        [Install]
        WantedBy=multi-user.target
        MCP_SERVICE
          
          echo "Enabling and starting MCP Server service..."
          sudo systemctl daemon-reload
          if ! sudo systemctl enable wazuh-mcp-server; then
            echo "ERROR: Failed to enable wazuh-mcp-server service"
            exit 1
          fi
          
          if ! sudo systemctl start wazuh-mcp-server; then
            echo "ERROR: Failed to start wazuh-mcp-server service"
            echo "Service status:"
            sudo systemctl status wazuh-mcp-server --no-pager
            echo "Service logs:"
            sudo journalctl -u wazuh-mcp-server --no-pager -n 20
            exit 1
          fi
          
          echo "MCP Server installation completed successfully"
        else
          echo "MCP Server directory already exists, skipping installation"
        fi

        echo "Installing OpenClaw Autopilot..."
        cd /opt
        sudo git clone https://github.com/gensecaihq/Wazuh-Openclaw-Autopilot openclaw-autopilot || true
        cd openclaw-autopilot
        
        # Set required environment variables for installation
        export AUTOPILOT_MODE=bootstrap
        export MCP_URL=http://localhost:3000
        export AUTOPILOT_MCP_AUTH=${MCP_API_KEY}
        export OPENCLAW_LLM_MODE=local
        export AUTOPILOT_REQUIRE_TAILSCALE=false
        export AUTOPILOT_INSTALL_MODE=bootstrap
        export WAZUH_MANAGER_IP=localhost
        export WAZUH_MANAGER_PORT=1514
        
        # Create environment file for OpenClaw
        sudo tee /opt/openclaw-autopilot/.env > /dev/null << 'ENV_EOF'
        AUTOPILOT_MODE=bootstrap
        MCP_URL=http://localhost:3000
        AUTOPILOT_MCP_AUTH=${MCP_API_KEY}
        OPENCLAW_LLM_MODE=local
        AUTOPILOT_REQUIRE_TAILSCALE=false
        AUTOPILOT_INSTALL_MODE=bootstrap
        WAZUH_MANAGER_IP=localhost
        WAZUH_MANAGER_PORT=1514
        OLLAMA_URL=http://localhost:11434
        AUTOPILOT_RESPONDER_ENABLED=true
        CORS_ORIGIN=*
        
        # OpenClaw Gateway Configuration
        OPENCLAW_GATEWAY_URL=http://127.0.0.1:18789
        OPENCLAW_TOKEN=${OPENCLAW_TOKEN}
        OPENCLAW_WEBHOOK_TOKEN=${OPENCLAW_WEBHOOK_TOKEN}
        OPENCLAW_HOST=127.0.0.1
        OPENCLAW_PORT=18789
        
        # Runtime API Configuration
        RUNTIME_PORT=9090
        METRICS_HOST=127.0.0.1
        
        # Data Directories
        AUTOPILOT_DATA_DIR=/var/lib/wazuh-autopilot
        AUTOPILOT_CONFIG_DIR=/etc/wazuh-autopilot
        
        # Approval Settings
        APPROVAL_TOKEN_TTL_MINUTES=60
        PLAN_EXPIRY_MINUTES=60
        ENV_EOF
        
        # Install Python dependencies
        sudo pip3 install -r requirements.txt 2>/dev/null || true
        
        # Install Node.js 24.x and OpenClaw CLI (requires Node.js 22.12+)
        echo "Installing Node.js 24.x..."
        curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
        sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -yq nodejs
        echo "Node.js version: $(node -v)"
        echo "NPM version: $(npm -v)"
        
        echo "Installing OpenClaw CLI..."
        if sudo npm install -g openclaw@latest; then
          echo "OpenClaw CLI installed successfully"
          echo "OpenClaw version: $(openclaw --version 2>/dev/null || echo 'Version check failed')"
        else
          echo "WARNING: OpenClaw CLI installation failed"
        fi
        
        # Install NPM dependencies and setup policies
        echo "Setting up autopilot dependencies..."
        if [ -d "/opt/openclaw-autopilot" ]; then
          echo " OpenClaw autopilot directory exists"
          cd /opt/openclaw-autopilot/runtime/autopilot-service || echo "Unable to change to autopilot-service directory"
          sudo npm install || true
          sudo mkdir -p /etc/wazuh-autopilot/policies
          sudo cp /opt/openclaw-autopilot/policies/* /etc/wazuh-autopilot/policies/ 2>/dev/null || echo "No policies to copy"
        else
          echo " OpenClaw autopilot directory not found at /opt/openclaw-autopilot"
          echo "Creating minimal directory structure..."
          sudo mkdir -p /opt/openclaw-autopilot/runtime/autopilot-service
          sudo mkdir -p /etc/wazuh-autopilot/policies
        fi
        
        # Try the main installer (may or may not work)
        echo "Attempting OpenClaw installation..."
        cd /opt/openclaw-autopilot || echo "Unable to change to autopilot directory"
        if [ -f "install/install.sh" ]; then
          echo "Found installer script, running..."
          sudo chmod +x install/install.sh
          sudo -E bash install/install.sh --mode bootstrap --skip-tailscale 2>&1 || echo "Main installer completed with issues, proceeding with manual setup..."
        else
          echo "Install script not found, skipping main installer"
        fi
        
        # Always create the systemd services (regardless of installer outcome)
        echo "Creating systemd service files..."
        
        # Create OpenClaw Autopilot systemd service
        echo "Creating wazuh-autopilot service..."
        if sudo tee /etc/systemd/system/wazuh-autopilot.service > /dev/null << 'AUTOPILOT_EOF'; then
        [Unit]
        Description=Wazuh OpenClaw Autopilot
        After=network.target wazuh-manager.service wazuh-mcp-server.service ollama.service

        [Service]
        Type=simple
        User=root
        WorkingDirectory=/opt/openclaw-autopilot/runtime/autopilot-service
        EnvironmentFile=/opt/openclaw-autopilot/.env
        ExecStart=/usr/bin/node index.js
        Restart=always
        RestartSec=10

        [Install]
        WantedBy=multi-user.target
        AUTOPILOT_EOF
          echo "Autopilot service file written successfully"
        else
          echo "Failed to write autopilot service file"
        fi
          
        # Find OpenClaw binary location
        OPENCLAW_PATH=$(which openclaw 2>/dev/null || echo "/usr/bin/openclaw")
        echo "Using OpenClaw at: $OPENCLAW_PATH"
        
        # Create OpenClaw Gateway systemd service
        sudo tee /etc/systemd/system/openclaw-gateway.service > /dev/null << 'GATEWAY_EOF'
        [Unit]
        Description=OpenClaw Gateway
        After=network.target ollama.service

        [Service]
        Type=simple
        User=root
        WorkingDirectory=/root
        EnvironmentFile=/opt/openclaw-autopilot/.env
        Environment="NODE_PATH=/usr/lib/node_modules"
        Environment="OPENCLAW_LLM_MODE=local"
        ExecStart=OPENCLAW_PATH_PLACEHOLDER gateway run --bind lan --port 18789 --force --token OPENCLAW_GATEWAY_TOKEN_PLACEHOLDER
        Restart=always
        RestartSec=10
        TimeoutStartSec=90

        [Install]
        WantedBy=multi-user.target
        GATEWAY_EOF
        
        # Replace placeholders in service file
        sudo sed -i "s|OPENCLAW_PATH_PLACEHOLDER|$OPENCLAW_PATH|g" /etc/systemd/system/openclaw-gateway.service
        sudo sed -i "s/OPENCLAW_GATEWAY_TOKEN_PLACEHOLDER/\${OPENCLAW_GATEWAY_TOKEN}/g" /etc/systemd/system/openclaw-gateway.service
        
        # Verify service files were created
        echo "Verifying service files..."
        if [ -f "/etc/systemd/system/wazuh-autopilot.service" ]; then
          echo " wazuh-autopilot.service created successfully"
        else
          echo " wazuh-autopilot.service creation failed"
        fi
        
        if [ -f "/etc/systemd/system/openclaw-gateway.service" ]; then
          echo " openclaw-gateway.service created successfully" 
        else
          echo " openclaw-gateway.service creation failed"
        fi
        
        # Setup OpenClaw configuration
        echo "Setting up OpenClaw configuration..."
        
        # Debug OpenClaw CLI availability
        echo "Debugging OpenClaw CLI at $OPENCLAW_PATH:"
        echo "  File exists: $([ -f "$OPENCLAW_PATH" ] && echo 'YES' || echo 'NO')"
        echo "  File executable: $([ -x "$OPENCLAW_PATH" ] && echo 'YES' || echo 'NO')"
        echo "  File permissions: $(ls -la "$OPENCLAW_PATH" 2>/dev/null || echo 'Cannot read permissions')"
        
        # Verify OpenClaw CLI is available and executable
        if [ -x "$OPENCLAW_PATH" ]; then
          echo "OpenClaw CLI found at $OPENCLAW_PATH, running setup..."
          sudo -u root -H "$OPENCLAW_PATH" setup || echo "OpenClaw setup completed with issues"
        else
          echo "OpenClaw CLI not found or not executable at $OPENCLAW_PATH, creating directories manually..."
          sudo mkdir -p /root/.openclaw/workspace
          sudo mkdir -p /root/.openclaw/agents/main/sessions
        fi
        
        # Ensure .openclaw directory exists before creating config
        sudo mkdir -p /root/.openclaw
        
        # Create OpenClaw configuration with external access and device auth bypass
        echo "Creating OpenClaw configuration file..."
        sudo tee /root/.openclaw/openclaw.json > /dev/null << 'EOF'
        {
          "meta": {
            "lastTouchedVersion": "2026.3.24",
            "lastTouchedAt": "2026-03-26T10:15:23.888Z"
          },
          "agents": {
            "defaults": {
              "workspace": "/root/.openclaw/workspace"
            }
          },
          "commands": {
            "native": "auto",
            "nativeSkills": "auto",
            "restart": true,
            "ownerDisplay": "raw"
          },
          "gateway": {
            "mode": "local",
            "auth": {
              "mode": "token",
              "token": "\${OPENCLAW_GATEWAY_TOKEN}"
            },
            "controlUi": {
              "allowedOrigins": ["*"],
              "dangerouslyAllowHostHeaderOriginFallback": true,
              "dangerouslyDisableDeviceAuth": true
            }
          }
        }
        EOF
        
        # Create OpenClaw data directories
        sudo mkdir -p /var/lib/wazuh-autopilot
        sudo mkdir -p /root/.openclaw/wazuh-autopilot/workspace
        
        # Enable and start services
        echo "Enabling and starting services..."
        sudo systemctl daemon-reload
        
        # Enable services
        if sudo systemctl enable openclaw-gateway 2>/dev/null; then
          echo " openclaw-gateway enabled successfully"
        else
          echo " Failed to enable openclaw-gateway"
        fi
        
        if sudo systemctl enable wazuh-autopilot 2>/dev/null; then
          echo " wazuh-autopilot enabled successfully"
        else
          echo " Failed to enable wazuh-autopilot (file may not exist)"
        fi
        
        # Start services individually with better error handling
        echo "Starting openclaw-gateway service..."
        if sudo systemctl start openclaw-gateway 2>/dev/null; then
          echo " openclaw-gateway started successfully"
        else
          echo " Failed to start openclaw-gateway"
          echo "Service status:"
          sudo systemctl status openclaw-gateway --no-pager -l || true
          echo "Recent logs:"
          sudo journalctl -u openclaw-gateway --no-pager -n 10 || true
        fi
        
        echo "Starting wazuh-autopilot service..."
        if sudo systemctl start wazuh-autopilot 2>/dev/null; then
          echo " wazuh-autopilot started successfully"
        else
          echo " Failed to start wazuh-autopilot"
        fi
        
        # Ensure MCP server is running
        echo "Ensuring MCP server is running..."
        sudo systemctl restart wazuh-mcp-server 2>/dev/null || true
        sleep 3

        echo "Verifying installation..."
        sudo systemctl status ollama --no-pager --lines=0 || echo "Ollama service check failed"
        
        # Check if MCP server service exists before checking status
        if sudo systemctl list-unit-files | grep -q wazuh-mcp-server; then
          sudo systemctl status wazuh-mcp-server --no-pager --lines=0 || echo "MCP server not running"
        else
          echo "Warning: wazuh-mcp-server service not found - installation may have failed"
        fi
        
        # Check if OpenClaw Autopilot service exists and is running
        if sudo systemctl list-unit-files | grep -q wazuh-autopilot; then
          sudo systemctl status wazuh-autopilot --no-pager --lines=0 || echo "OpenClaw Autopilot not running"
        else
          echo "Warning: wazuh-autopilot service not found"
        fi
        
        # Check if OpenClaw Gateway service exists and is running
        if sudo systemctl list-unit-files | grep -q openclaw-gateway; then
          sudo systemctl status openclaw-gateway --no-pager --lines=0 || echo "OpenClaw Gateway not running"
        else
          echo "Warning: openclaw-gateway service not found"
        fi

        echo "Testing OpenClaw runtime API accessibility..."
        curl -s http://localhost:9090/health || echo "Runtime API not accessible on port 9090"
        
        echo "Testing OpenClaw Gateway dashboard accessibility..."
        curl -s -o /dev/null -w "%{http_code}" http://localhost:18789 || echo "Gateway dashboard not accessible on port 18789"
        
        echo "=== OpenClaw Gateway Ready ==="
        echo "Dashboard URL: http://$(curl -s ifconfig.me 2>/dev/null):18789"
        echo "Use the OPENCLAW_GATEWAY_TOKEN secret to authenticate when connecting"
        
        echo "Deployment complete!"
        EOF
        
        chmod +x deploy.sh

    - name: Deploy to Wazuh Manager VM
      run: |
        echo "Waiting for VM to be ready..."
        sleep 30
        
        echo "Copying deployment script..."
        gcloud compute scp deploy.sh wazuh-manager:~/deploy.sh --zone=${{ env.GCP_ZONE }} --ssh-key-expire-after=1h
        
        echo "Executing deployment script..."
        gcloud compute ssh wazuh-manager \
          --zone=${{ env.GCP_ZONE }} \
          --ssh-key-expire-after=1h \
          --command="MCP_API_KEY='${{ secrets.MCP_API_KEY }}' OPENCLAW_GATEWAY_TOKEN='${{ secrets.OPENCLAW_GATEWAY_TOKEN }}' OPENCLAW_TOKEN='${{ secrets.OPENCLAW_TOKEN }}' OPENCLAW_WEBHOOK_TOKEN='${{ secrets.OPENCLAW_WEBHOOK_TOKEN }}' bash ~/deploy.sh"

    - name: Output Autopilot Details
      run: |
        VM_IP=$(gcloud compute instances describe wazuh-manager \
          --zone=${{ env.GCP_ZONE }} \
          --format='get(networkInterfaces[0].accessConfigs[0].natIP)')
        
        echo "## Wazuh OpenClaw Autopilot Deployed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### AI Security Operations Dashboard" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**OpenClaw Dashboard:** http://$VM_IP:18789" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Authentication:** Use the \`OPENCLAW_GATEWAY_TOKEN\` repository secret" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**OpenClaw Runtime API:** http://$VM_IP:9090" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- View AI agent sessions and security analysis" >> $GITHUB_STEP_SUMMARY
        echo "- Manage automated incident response" >> $GITHUB_STEP_SUMMARY
        echo "- Approve/reject AI recommendations" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### AI Infrastructure" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Ollama API:** http://$VM_IP:11434" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- Local AI model (llama3.2:3b)" >> $GITHUB_STEP_SUMMARY
        echo "- No external API costs" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**MCP Server:** http://$VM_IP:3000" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- AI bridge to Wazuh Manager" >> $GITHUB_STEP_SUMMARY
        echo "- Security data API for AI agents" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Existing Wazuh Infrastructure" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Wazuh Dashboard:** https://$VM_IP" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- Traditional security monitoring" >> $GITHUB_STEP_SUMMARY
        echo "- Raw alerts and agent management" >> $GITHUB_STEP_SUMMARY