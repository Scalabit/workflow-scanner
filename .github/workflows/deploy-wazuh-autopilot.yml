name: Deploy Wazuh OpenClaw Autopilot

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: string
      gcp_zone:
        description: 'GCP Zone'
        required: true
        type: string

  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
        - production

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GCP_ZONE: ${{ inputs.gcp_zone || secrets.GCP_ZONE }}

jobs:
  deploy:
    name: Deploy Autopilot to GCP VM
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Create deployment script
      run: |
        cat > deploy.sh << 'EOF'
        #!/bin/bash
        set -e
        
        echo "Starting fresh OpenClaw Autopilot deployment..."
        
        # Clean up any previous installations
        echo "Cleaning up previous installations..."
        sudo systemctl stop wazuh-mcp-server 2>/dev/null || true
        sudo systemctl stop wazuh-autopilot 2>/dev/null || true
        sudo systemctl disable wazuh-mcp-server 2>/dev/null || true
        sudo systemctl disable wazuh-autopilot 2>/dev/null || true
        sudo rm -f /etc/systemd/system/wazuh-mcp-server.service
        sudo rm -f /etc/systemd/system/wazuh-autopilot.service
        sudo rm -rf /opt/wazuh-mcp-server
        sudo rm -rf /opt/openclaw-autopilot
        sudo systemctl daemon-reload
        
        echo "Installing Ollama..."
        if ! command -v ollama &> /dev/null; then
          curl -fsSL https://ollama.com/install.sh | sh
          sudo mkdir -p /etc/systemd/system/ollama.service.d/
          sudo tee /etc/systemd/system/ollama.service.d/override.conf > /dev/null << 'OLLAMA_CONF'
        [Service]
        Environment="OLLAMA_NUM_CTX=32768"
        Environment="OLLAMA_HOST=0.0.0.0"
        Environment="OLLAMA_KEEP_ALIVE=24h"
        Environment="OLLAMA_FLASH_ATTENTION=1"
        Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
        OLLAMA_CONF
          
          sudo systemctl daemon-reload
          sudo systemctl enable ollama
          sudo systemctl start ollama
          sleep 10
          # Clean up any existing models to prevent conflicts
          ollama rm smollm:135m 2>/dev/null || true
          ollama rm llama3.2:1b 2>/dev/null || true  
          ollama rm llama3.2:3b 2>/dev/null || true
          
          # Pull the working model that supports tools
          ollama pull qwen2.5:0.5b
        fi

        echo "Waiting for background apt processes to finish..."
        while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || sudo fuser /var/lib/dpkg/lock >/dev/null 2>&1 || sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
          echo "Waiting for apt/dpkg locks to be released..."
          sleep 10
        done
        
        # Kill any hanging apt processes
        sudo pkill -f apt-get || true
        sudo pkill -f dpkg || true
        sleep 5
        
        # Wait for system to be ready
        echo "Ensuring system is ready for package installation..."
        sudo systemctl is-system-running --wait || true
        
        # Remove any stale locks
        sudo rm -f /var/lib/apt/lists/lock
        sudo rm -f /var/cache/apt/archives/lock
        sudo rm -f /var/lib/dpkg/lock*
        
        echo "Installing Python and pip..."
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -yq python3 python3-pip
        
        echo "Installing MCP Server..."
        if [ ! -d "/opt/wazuh-mcp-server" ]; then
          echo "Cloning MCP Server repository..."
          cd /opt
          if ! sudo git clone https://github.com/gensecaihq/Wazuh-MCP-Server wazuh-mcp-server; then
            echo "ERROR: Failed to clone MCP Server repository"
            exit 1
          fi
          
          cd wazuh-mcp-server
          echo "Installing Python dependencies..."
          if ! sudo pip3 install -r requirements.txt; then
            echo "ERROR: Failed to install Python dependencies"
            echo "Contents of requirements.txt:"
            cat requirements.txt
            exit 1
          fi
          
          echo "Creating systemd service file..."
          sudo tee /etc/systemd/system/wazuh-mcp-server.service > /dev/null << MCP_SERVICE
        [Unit]
        Description=Wazuh MCP Server
        After=network.target wazuh-manager.service ollama.service
        
        [Service]
        Type=simple
        User=root
        WorkingDirectory=/opt/wazuh-mcp-server
        Environment=WAZUH_HOST=localhost
        Environment=WAZUH_PORT=55000
        Environment=WAZUH_USER=wazuh
        Environment=WAZUH_VERIFY_SSL=false
        Environment=MCP_PORT=3000
        Environment=MCP_HOST=0.0.0.0
        Environment=AUTH_MODE=bearer
        Environment=MCP_API_KEY=${MCP_API_KEY}
        ExecStart=/usr/bin/python3 -m src.wazuh_mcp_server
        Restart=always
        RestartSec=10
        
        [Install]
        WantedBy=multi-user.target
        MCP_SERVICE
          
          echo "Enabling and starting MCP Server service..."
          sudo systemctl daemon-reload
          if ! sudo systemctl enable wazuh-mcp-server; then
            echo "ERROR: Failed to enable wazuh-mcp-server service"
            exit 1
          fi
          
          if ! sudo systemctl start wazuh-mcp-server; then
            echo "ERROR: Failed to start wazuh-mcp-server service"
            echo "Service status:"
            sudo systemctl status wazuh-mcp-server --no-pager
            echo "Service logs:"
            sudo journalctl -u wazuh-mcp-server --no-pager -n 20
            exit 1
          fi
          
          echo "MCP Server installation completed successfully"
        else
          echo "MCP Server directory already exists, skipping installation"
        fi

        echo "Installing OpenClaw Autopilot..."
        cd /opt
        sudo git clone https://github.com/gensecaihq/Wazuh-Openclaw-Autopilot openclaw-autopilot || true
        cd openclaw-autopilot
        
        # Set required environment variables for installation
        export AUTOPILOT_MODE=bootstrap
        export MCP_URL=http://localhost:3000
        export AUTOPILOT_MCP_AUTH=${MCP_API_KEY}
        export OPENCLAW_LLM_MODE=local
        export AUTOPILOT_REQUIRE_TAILSCALE=false
        export AUTOPILOT_INSTALL_MODE=bootstrap
        export WAZUH_MANAGER_IP=localhost
        export WAZUH_MANAGER_PORT=1514
        
        # Create environment file for OpenClaw
        cat > /tmp/openclaw-autopilot.env << 'ENV_EOF'
        AUTOPILOT_MODE=bootstrap
        MCP_URL=http://localhost:3000
        AUTOPILOT_MCP_AUTH=MCP_API_KEY_PLACEHOLDER
        OPENCLAW_LLM_MODE=local
        AUTOPILOT_REQUIRE_TAILSCALE=false
        AUTOPILOT_INSTALL_MODE=bootstrap
        WAZUH_MANAGER_IP=localhost
        WAZUH_MANAGER_PORT=1514
        OLLAMA_URL=http://localhost:11434
        AUTOPILOT_RESPONDER_ENABLED=true
        CORS_ORIGIN=*
        
        # OpenClaw Gateway Configuration
        OPENCLAW_GATEWAY_URL=http://127.0.0.1:18789
        OPENCLAW_TOKEN=OPENCLAW_TOKEN_PLACEHOLDER
        OPENCLAW_WEBHOOK_TOKEN=OPENCLAW_WEBHOOK_TOKEN_PLACEHOLDER
        OPENCLAW_GATEWAY_TOKEN=OPENCLAW_GATEWAY_TOKEN_PLACEHOLDER
        AUTOPILOT_API_KEY=MCP_API_KEY_PLACEHOLDER
        OPENCLAW_HOST=127.0.0.1
        OPENCLAW_PORT=18789
        
        # Runtime API Configuration
        RUNTIME_PORT=9090
        METRICS_HOST=127.0.0.1
        
        # Data Directories
        AUTOPILOT_DATA_DIR=/var/lib/wazuh-autopilot
        AUTOPILOT_CONFIG_DIR=/etc/wazuh-autopilot
        
        # Approval Settings
        APPROVAL_TOKEN_TTL_MINUTES=60
        PLAN_EXPIRY_MINUTES=60
        ENV_EOF
        
        # Replace placeholders in environment file
        sed -i "s/MCP_API_KEY_PLACEHOLDER/${MCP_API_KEY}/g" /tmp/openclaw-autopilot.env
        sed -i "s/OPENCLAW_TOKEN_PLACEHOLDER/${OPENCLAW_TOKEN}/g" /tmp/openclaw-autopilot.env
        sed -i "s/OPENCLAW_WEBHOOK_TOKEN_PLACEHOLDER/${OPENCLAW_WEBHOOK_TOKEN}/g" /tmp/openclaw-autopilot.env
        sed -i "s/OPENCLAW_GATEWAY_TOKEN_PLACEHOLDER/${OPENCLAW_GATEWAY_TOKEN}/g" /tmp/openclaw-autopilot.env
        
        sudo mv /tmp/openclaw-autopilot.env /opt/openclaw-autopilot/.env
        
        # Install Python dependencies
        sudo pip3 install -r requirements.txt 2>/dev/null || true
        
        # Install Node.js 24.x and OpenClaw CLI (requires Node.js 22.12+)
        echo "Installing Node.js 24.x..."
        curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
        sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -yq nodejs
        echo "Node.js version: $(node -v)"
        echo "NPM version: $(npm -v)"
        
        echo "Installing OpenClaw CLI..."
        if sudo npm install -g openclaw@latest; then
          echo "OpenClaw CLI installed successfully"
          echo "OpenClaw version: $(openclaw --version 2>/dev/null || echo 'Version check failed')"
        else
          echo "WARNING: OpenClaw CLI installation failed"
        fi
        
        # Install NPM dependencies and setup policies
        echo "Setting up autopilot dependencies..."
        if [ -d "/opt/openclaw-autopilot" ]; then
          echo " OpenClaw autopilot directory exists"
          cd /opt/openclaw-autopilot/runtime/autopilot-service || echo "Unable to change to autopilot-service directory"
          sudo npm install || true
          sudo mkdir -p /etc/wazuh-autopilot/policies
          sudo cp /opt/openclaw-autopilot/policies/* /etc/wazuh-autopilot/policies/ 2>/dev/null || echo "No policies to copy"
        else
          echo " OpenClaw autopilot directory not found at /opt/openclaw-autopilot"
          echo "Creating minimal directory structure..."
          sudo mkdir -p /opt/openclaw-autopilot/runtime/autopilot-service
          sudo mkdir -p /etc/wazuh-autopilot/policies
        fi
        
        # Try the main installer (may or may not work)
        echo "Attempting OpenClaw installation..."
        cd /opt/openclaw-autopilot || echo "Unable to change to autopilot directory"
        if [ -f "install/install.sh" ]; then
          echo "Found installer script, running..."
          sudo chmod +x install/install.sh
          sudo -E bash install/install.sh --mode bootstrap --skip-tailscale 2>&1 || echo "Main installer completed with issues, proceeding with manual setup..."
        else
          echo "Install script not found, skipping main installer"
        fi
        
        # Always create the systemd services (regardless of installer outcome)
        echo "Creating systemd service files..."
        
        # Create OpenClaw Autopilot systemd service
        echo "Creating wazuh-autopilot service..."
        cat > /tmp/wazuh-autopilot.service << 'AUTOPILOT_EOF'
        [Unit]
        Description=Wazuh OpenClaw Autopilot
        After=network.target wazuh-manager.service wazuh-mcp-server.service ollama.service

        [Service]
        Type=simple
        User=root
        WorkingDirectory=/opt/openclaw-autopilot/runtime/autopilot-service
        EnvironmentFile=/opt/openclaw-autopilot/.env
        ExecStart=/usr/bin/node index.js
        Restart=always
        RestartSec=10

        [Install]
        WantedBy=multi-user.target
        AUTOPILOT_EOF
        
        sudo mv /tmp/wazuh-autopilot.service /etc/systemd/system/wazuh-autopilot.service
        echo "Autopilot service file created successfully"
          
        # Find OpenClaw binary location
        OPENCLAW_PATH=$(which openclaw 2>/dev/null || echo "/usr/bin/openclaw")
        echo "Using OpenClaw at: $OPENCLAW_PATH"
        
        # Create OpenClaw Gateway systemd service with nuclear environment overrides
        cat > /tmp/openclaw-gateway.service << 'GATEWAY_EOF'
        [Unit]
        Description=OpenClaw Gateway
        After=network.target ollama.service

        [Service]
        Type=simple
        User=root
        WorkingDirectory=/root
        EnvironmentFile=/opt/openclaw-autopilot/.env
        Environment="NODE_PATH=/usr/lib/node_modules"
        Environment="OPENCLAW_LLM_MODE=local"
        Environment="OLLAMA_API_KEY=ollama-local"
        Environment="MODEL=ollama/qwen2.5:0.5b"
        Environment="LLM_MODEL=ollama/qwen2.5:0.5b"
        Environment="ANTHROPIC_API_KEY=not-needed"
        ExecStart=OPENCLAW_PATH_PLACEHOLDER gateway run --bind lan --port 18789 --force --token OPENCLAW_GATEWAY_TOKEN_PLACEHOLDER
        Restart=always
        RestartSec=10
        TimeoutStartSec=90

        [Install]
        WantedBy=multi-user.target
        GATEWAY_EOF
        
        # Replace placeholders in the gateway service file
        sed -i "s|OPENCLAW_PATH_PLACEHOLDER|$OPENCLAW_PATH|g" /tmp/openclaw-gateway.service
        sed -i "s|OPENCLAW_GATEWAY_TOKEN_PLACEHOLDER|${OPENCLAW_GATEWAY_TOKEN}|g" /tmp/openclaw-gateway.service
        
        sudo mv /tmp/openclaw-gateway.service /etc/systemd/system/openclaw-gateway.service
        
        # Verify service files were created
        echo "Verifying service files..."
        if [ -f "/etc/systemd/system/wazuh-autopilot.service" ]; then
          echo " wazuh-autopilot.service created successfully"
        else
          echo " wazuh-autopilot.service creation failed"
        fi
        
        if [ -f "/etc/systemd/system/openclaw-gateway.service" ]; then
          echo " openclaw-gateway.service created successfully" 
        else
          echo " openclaw-gateway.service creation failed"
        fi
        
        # Setup OpenClaw configuration
        echo "Setting up OpenClaw configuration..."
        
        # Debug OpenClaw CLI availability
        echo "Debugging OpenClaw CLI at $OPENCLAW_PATH:"
        if [ -f "$OPENCLAW_PATH" ]; then
          echo "  File exists: YES"
        else
          echo "  File exists: NO"
        fi
        if [ -x "$OPENCLAW_PATH" ]; then
          echo "  File executable: YES"
        else
          echo "  File executable: NO"
        fi
        echo "  File permissions: $(ls -la "$OPENCLAW_PATH" 2>/dev/null || echo 'Cannot read permissions')"
        
        # Verify OpenClaw CLI is available and executable
        if [ -x "$OPENCLAW_PATH" ]; then
          echo "OpenClaw CLI found at $OPENCLAW_PATH, running non-interactive onboarding for Ollama..."
          # Use onboard command instead of setup, with non-interactive Ollama configuration
          sudo -u root -H "$OPENCLAW_PATH" onboard --non-interactive \
            --auth-choice ollama \
            --custom-model-id "qwen2.5:0.5b" \
            --accept-risk \
            --gateway-port 18789 \
            --gateway-bind lan \
            --token "${OPENCLAW_GATEWAY_TOKEN}" \
            --skip-skills 2>&1 || echo "OpenClaw onboarding completed with issues"
        else
          echo "OpenClaw CLI not found or not executable at $OPENCLAW_PATH, creating directories manually..."
        fi
        
        # NUCLEAR OPTION: Patch all OpenClaw files to replace hardcoded Anthropic defaults
        echo "Applying nuclear patch to OpenClaw files to force Ollama usage..."
        echo "WARNING: Performing comprehensive binary patching of OpenClaw to override hardcoded Anthropic defaults"
        
        # Nuclear patch: Use grep and xargs for faster, more reliable patching
        echo " Applying nuclear patch: Replace Anthropic references with Ollama"
        cd /usr/lib/node_modules/openclaw 2>/dev/null || echo "OpenClaw directory not found, skipping nuclear patch"
        
        if [ -d "/usr/lib/node_modules/openclaw" ]; then
          # Patch 1: Full model paths
          sudo grep -r -l "anthropic/claude-opus-4-6" . 2>/dev/null | sudo xargs -r sed -i 's|anthropic/claude-opus-4-6|ollama/qwen2.5:0.5b|g' 2>/dev/null || true
          echo " - anthropic/claude-opus-4-6 -> ollama/qwen2.5:0.5b"
          
          # Patch 2: Model identifiers  
          sudo grep -r -l "claude-opus-4-6" . 2>/dev/null | sudo xargs -r sed -i 's|claude-opus-4-6|qwen2.5:0.5b|g' 2>/dev/null || true
          echo " - claude-opus-4-6 -> qwen2.5:0.5b"
          
          # Patch 3: Provider references
          sudo grep -r -l "anthropic/claude" . 2>/dev/null | sudo xargs -r sed -i 's|anthropic/claude|ollama/llama|g' 2>/dev/null || true
          echo " - anthropic/claude -> ollama/llama"
          
          echo " Nuclear patching completed"
        fi
        
        echo "Nuclear patching completed - OpenClaw should now use Ollama instead of Anthropic"
        
        # Ensure directories exist
        echo "Ensuring OpenClaw directories exist..."
        sudo mkdir -p /root/.openclaw/workspace
        sudo mkdir -p /root/.openclaw/agents/main/sessions
        
        # Ensure .openclaw directory exists before creating config
        sudo mkdir -p /root/.openclaw
        
        # Generate separate token for hooks (cannot be same as gateway token)
        HOOKS_TOKEN=$(openssl rand -hex 24)
        echo "Generated hooks token: $HOOKS_TOKEN"
        
        # Create OpenClaw configuration with proper models and webhook hooks
        echo "Creating OpenClaw configuration file with Ollama and webhook support..."
        sudo tee /root/.openclaw/openclaw.json > /dev/null << 'OPENCLAW_JSON_EOF'
        {
          "meta": {
            "lastTouchedVersion": "2026.3.24",
            "lastTouchedAt": "2026-03-30T09:00:00.000Z"
          },
          "wizard": {
            "lastRunAt": "2026-03-30T09:00:00.000Z",
            "lastRunVersion": "2026.3.24",
            "lastRunCommand": "onboard",
            "lastRunMode": "local"
          },
          "models": {
            "mode": "replace",
            "providers": {
              "ollama": {
                "baseUrl": "http://localhost:11434",
                "apiKey": "ollama-local",
                "api": "ollama",
                "models": [
                  {
                    "id": "qwen2.5:0.5b",
                    "name": "qwen2.5:0.5b",
                    "reasoning": false,
                    "input": [
                      "text"
                    ],
                    "cost": {
                      "input": 0,
                      "output": 0,
                      "cacheRead": 0,
                      "cacheWrite": 0
                    },
                    "contextWindow": 131072,
                    "maxTokens": 8192
                  }
                ]
              }
            }
          },
          "agents": {
            "defaults": {
              "model": {
                "primary": "ollama/qwen2.5:0.5b",
                "fallbacks": []
              },
              "workspace": "/root/.openclaw/workspace"
            },
            "list": [
              {
                "id": "main",
                "model": "ollama/qwen2.5:0.5b"
              },
              {
                "id": "wazuh-agent",
                "name": "wazuh-agent",
                "workspace": "/root/.openclaw/workspace",
                "agentDir": "/root/.openclaw/agents/wazuh-agent/agent",
                "model": "ollama/qwen2.5:0.5b"
              }
            ]
          },
          "tools": {
            "profile": "coding"
          },
          "commands": {
            "native": "auto",
            "nativeSkills": "auto",
            "restart": true,
            "ownerDisplay": "raw"
          },
          "session": {
            "dmScope": "per-channel-peer"
          },
          "gateway": {
            "port": 18789,
            "mode": "local",
            "bind": "loopback",
            "auth": {
              "mode": "token",
              "token": "${OPENCLAW_GATEWAY_TOKEN}"
            },
            "tailscale": {
              "mode": "off",
              "resetOnExit": false
            },
            "controlUi": {
              "allowedOrigins": ["*"],
              "dangerouslyAllowHostHeaderOriginFallback": true,
              "dangerouslyDisableDeviceAuth": true
            }
          },
          "hooks": {
            "enabled": true,
            "token": "HOOKS_TOKEN_PLACEHOLDER",
            "path": "/hooks",
            "defaultSessionKey": "hook:wazuh",
            "allowRequestSessionKey": false,
            "allowedSessionKeyPrefixes": ["hook:"],
            "mappings": [
              {
                "id": "wazuh-alert",
                "match": { "path": "wazuh-alert" },
                "action": "agent",
                "agentId": "main",
                "wakeMode": "now",
                "name": "Wazuh Security Alert",
                "sessionKey": "hook:wazuh:{{rule.id}}",
                "messageTemplate": "WAZUH SECURITY ALERT\\n\\nRule: {{rule.description}} (ID: {{rule.id}})\\nLevel: {{rule.level}}\\nAgent: {{agent.name}}\\nTimestamp: {{timestamp}}\\n\\nFull Alert:\\n{{.}}",
                "deliver": true,
                "thinking": "low",
                "timeoutSeconds": 300
              }
            ]
          },
          "skills": {
            "install": {
              "nodeManager": "npm"
            }
          },
          "plugins": {
            "entries": {
              "ollama": {
                "enabled": true
              }
            }
          }
        }
        OPENCLAW_JSON_EOF
        
        # Replace the hooks token placeholder with the actual token
        sudo sed -i "s/HOOKS_TOKEN_PLACEHOLDER/${HOOKS_TOKEN}/g" /root/.openclaw/openclaw.json
        echo "Hooks token replaced in configuration"
        
        # Create auth configuration for Ollama (no API key needed for local)
        echo "Creating OpenClaw auth configuration for local Ollama..."
        sudo mkdir -p /root/.openclaw/agents/main/agent
        sudo tee /root/.openclaw/agents/main/agent/auth-profiles.json > /dev/null << 'AUTH_EOF'
        {
          "ollama": {
            "baseUrl": "http://localhost:11434",
            "apiKey": "ollama-local"
          }
        }
        AUTH_EOF
        echo "Auth configuration created successfully"
        
        # Create OpenClaw data directories
        sudo mkdir -p /var/lib/wazuh-autopilot
        sudo mkdir -p /root/.openclaw/wazuh-autopilot/workspace
        
        # Create Wazuh integration script for OpenClaw webhooks
        echo "Creating Wazuh integration script for OpenClaw..."
        sudo tee /var/ossec/integrations/custom-openclaw > /dev/null << 'INTEGRATION_SCRIPT'
        #!/bin/bash
        
        # OpenClaw Webhook Integration for Wazuh
        # This script forwards Wazuh alerts to OpenClaw via webhook
        
        # Read the JSON alert from stdin
        while read ALERT; do
            # Forward the alert to OpenClaw webhook endpoint
            curl -X POST \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer HOOKS_TOKEN_PLACEHOLDER" \
                --data "$ALERT" \
                "http://localhost:18789/hooks/wazuh-alert" \
                --silent --show-error --max-time 10 || \
                echo "$(date) - Failed to send alert to OpenClaw: $ALERT" >> /var/log/wazuh-openclaw-integration.log
        done
        INTEGRATION_SCRIPT
        
        # Replace the hooks token placeholder in integration script
        sudo sed -i "s/HOOKS_TOKEN_PLACEHOLDER/${HOOKS_TOKEN}/g" /var/ossec/integrations/custom-openclaw
        
        # Set proper permissions for integration script
        sudo chmod 750 /var/ossec/integrations/custom-openclaw
        sudo chown root:wazuh /var/ossec/integrations/custom-openclaw
        echo "Wazuh integration script created successfully"
        
        # Create webhook configuration updater script
        echo "Creating webhook configuration script..."
        sudo tee /usr/local/bin/update-wazuh-webhooks.sh > /dev/null << WEBHOOK_SCRIPT
        #!/bin/bash
        
        # Wait for OpenClaw to be ready
        echo "Waiting for OpenClaw Gateway to be ready..."
        while ! curl -s http://localhost:18789/ > /dev/null 2>&1; do
            echo "Waiting for OpenClaw Gateway..."
            sleep 5
        done
        
        echo "OpenClaw Gateway is ready, updating Wazuh webhooks..."
        
        # Update webhook URLs with correct endpoints and authentication
        if [ -f /var/ossec/etc/ossec.conf ]; then
            cp /var/ossec/etc/ossec.conf /var/ossec/etc/ossec.conf.pre-webhook
            
            # Check if integration already exists and update it
            if grep -q "custom-openclaw" /var/ossec/etc/ossec.conf; then
                echo "Updating existing custom-openclaw integration"
                # Update the webhook URL to use correct endpoint
                sed -i 's|<url>http://localhost:18789/webhook/wazuh-alert</url>|<url>http://localhost:18789/hooks/wazuh-alert</url>|g' /var/ossec/etc/ossec.conf
            else
                echo "Adding new custom-openclaw integration to ossec.conf"
                # Create integration block and add it before closing tag
                INTEGRATION_BLOCK="  <integration>\\n      <name>custom-openclaw</name>\\n      <level>5</level>\\n      <alert_format>json</alert_format>\\n  </integration>"
                sed -i "/<\/ossec_config>/i\\$INTEGRATION_BLOCK" /var/ossec/etc/ossec.conf
            fi
            
            echo "Webhook configuration updated with correct endpoints"
            
            # Restart Wazuh manager to apply webhook config
            systemctl restart wazuh-manager
            echo "Wazuh manager restarted with webhook configuration"
        else
            echo "Error: Wazuh configuration file not found"
        fi
        WEBHOOK_SCRIPT
        
        sudo chmod +x /usr/local/bin/update-wazuh-webhooks.sh
        
        # Add root to wazuh group for alert file access
        echo "Adding root user to wazuh group for alert file access..."
        sudo usermod -a -G wazuh root || echo "Failed to add root to wazuh group"
        
        # Enable and start services
        echo "Enabling and starting services..."
        sudo systemctl daemon-reload
        
        # Enable services
        if sudo systemctl enable openclaw-gateway 2>/dev/null; then
          echo " openclaw-gateway enabled successfully"
        else
          echo " Failed to enable openclaw-gateway"
        fi
        
        if sudo systemctl enable wazuh-autopilot 2>/dev/null; then
          echo " wazuh-autopilot enabled successfully"
        else
          echo " Failed to enable wazuh-autopilot (file may not exist)"
        fi
        
        # Start services individually with better error handling
        echo "Starting openclaw-gateway service..."
        if sudo systemctl start openclaw-gateway 2>/dev/null; then
          echo " openclaw-gateway started successfully"
        else
          echo " Failed to start openclaw-gateway"
          echo "Service status:"
          sudo systemctl status openclaw-gateway --no-pager -l || true
          echo "Recent logs:"
          sudo journalctl -u openclaw-gateway --no-pager -n 10 || true
        fi
        
        echo "Starting wazuh-autopilot service..."
        if sudo systemctl start wazuh-autopilot 2>/dev/null; then
          echo " wazuh-autopilot started successfully"
        else
          echo " Failed to start wazuh-autopilot"
        fi
        
        # Ensure MCP server is running
        echo "Ensuring MCP server is running..."
        sudo systemctl restart wazuh-mcp-server 2>/dev/null || true
        sleep 3
        
        # Configure webhook integration after all services are running
        echo "Configuring Wazuh webhook integration..."
        sudo /usr/local/bin/update-wazuh-webhooks.sh || echo "Webhook configuration failed, continuing..."

        echo "Verifying installation..."
        sudo systemctl status ollama --no-pager --lines=0 || echo "Ollama service check failed"
        
        # Check if MCP server service exists before checking status
        if sudo systemctl list-unit-files | grep -q wazuh-mcp-server; then
          sudo systemctl status wazuh-mcp-server --no-pager --lines=0 || echo "MCP server not running"
        else
          echo "Warning: wazuh-mcp-server service not found - installation may have failed"
        fi
        
        # Check if OpenClaw Autopilot service exists and is running
        if sudo systemctl list-unit-files | grep -q wazuh-autopilot; then
          sudo systemctl status wazuh-autopilot --no-pager --lines=0 || echo "OpenClaw Autopilot not running"
        else
          echo "Warning: wazuh-autopilot service not found"
        fi
        
        # Check if OpenClaw Gateway service exists and is running
        if sudo systemctl list-unit-files | grep -q openclaw-gateway; then
          sudo systemctl status openclaw-gateway --no-pager --lines=0 || echo "OpenClaw Gateway not running"
        else
          echo "Warning: openclaw-gateway service not found"
        fi

        echo "Testing OpenClaw runtime API accessibility..."
        curl -s http://localhost:9090/health || echo "Runtime API not accessible on port 9090"
        
        echo "Testing OpenClaw Gateway dashboard accessibility..."
        curl -s -o /dev/null -w "%{http_code}" http://localhost:18789 || echo "Gateway dashboard not accessible on port 18789"
        
        # Test webhook endpoint is working
        echo "Testing webhook endpoint..."
        WEBHOOK_TEST_RESPONSE=$(curl -s -X POST \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${HOOKS_TOKEN}" \
          -d "{\"test\":\"webhook\",\"timestamp\":\"$(date -Iseconds)\",\"rule\":{\"id\":\"test\",\"level\":8,\"description\":\"Test webhook\"}}" \
          http://localhost:18789/hooks/wazuh-alert)
        
        if echo "${WEBHOOK_TEST_RESPONSE}" | grep -q '"ok":true'; then
          echo " Webhook endpoint is working correctly"
        else
          echo " WARNING: Webhook endpoint test failed - Response: ${WEBHOOK_TEST_RESPONSE}"
        fi
        
        # Verify integration script exists and has correct permissions
        if [ -f "/var/ossec/integrations/custom-openclaw" ] && [ -x "/var/ossec/integrations/custom-openclaw" ]; then
          echo " Wazuh integration script is properly installed"
        else
          echo " ERROR: Wazuh integration script missing or not executable"
        fi
        
        # Check if Wazuh integration is enabled
        if grep -q "custom-openclaw" /var/ossec/logs/ossec.log; then
          echo " Wazuh integration is enabled and recognized"
        else
          echo " WARNING: Wazuh integration may not be properly enabled"
        fi
        
        # Verify OpenClaw is using Ollama model
        if sudo journalctl -u openclaw-gateway --no-pager -n 10 | grep -q "agent model: ollama/qwen2.5:0.5b"; then
          echo " OpenClaw is correctly using Ollama model"
        else
          echo " WARNING: OpenClaw may not be using the correct Ollama model"
        fi
        
        echo "=== OpenClaw Gateway Ready ==="
        echo "Dashboard URL: http://$(curl -s ifconfig.me 2>/dev/null):18789"
        echo "Use the OPENCLAW_GATEWAY_TOKEN secret to authenticate when connecting"
        echo "Webhook Token: ${HOOKS_TOKEN}"
        echo "Integration: Wazuh -> OpenClaw webhook communication configured"
        
        echo "Deployment complete!"
        EOF
        
        chmod +x deploy.sh

    - name: Deploy to Wazuh Manager VM
      run: |
        echo "Waiting for VM to be ready..."
        sleep 30
        
        echo "Copying deployment script..."
        gcloud compute scp deploy.sh wazuh-manager:~/deploy.sh --zone=${{ env.GCP_ZONE }} --ssh-key-expire-after=1h
        
        echo "Executing deployment script..."
        gcloud compute ssh wazuh-manager \
          --zone=${{ env.GCP_ZONE }} \
          --ssh-key-expire-after=1h \
          --command="MCP_API_KEY='${{ secrets.MCP_API_KEY }}' OPENCLAW_GATEWAY_TOKEN='${{ secrets.OPENCLAW_GATEWAY_TOKEN }}' OPENCLAW_TOKEN='${{ secrets.OPENCLAW_TOKEN }}' OPENCLAW_WEBHOOK_TOKEN='${{ secrets.OPENCLAW_WEBHOOK_TOKEN }}' bash ~/deploy.sh"

