name: Deploy Wazuh OpenClaw Autopilot

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: string
      gcp_zone:
        description: 'GCP Zone'
        required: true
        type: string

  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
        - production

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GCP_ZONE: ${{ inputs.gcp_zone || secrets.GCP_ZONE }}

jobs:
  deploy:
    name: Deploy Autopilot to GCP VM
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Deploy to Wazuh Manager VM
      run: |
        echo "Copying official OpenClaw Autopilot with Qwen configuration to VM..."
        gcloud compute scp --recurse wazuh-autopilot wazuh-manager:/tmp/ --zone=${{ env.GCP_ZONE }} --ssh-key-expire-after=1h
        
        echo "Verifying Qwen models are configured..."
        gcloud compute ssh wazuh-manager \
          --zone=${{ env.GCP_ZONE }} \
          --ssh-key-expire-after=1h \
          --command="echo 'Qwen models configured:' && grep -c 'qwen2.5' /tmp/wazuh-autopilot/openclaw/openclaw-airgapped.json"
        
        echo "Installing Python 3.11+ (required for OpenClaw Autopilot)..."
        gcloud compute ssh wazuh-manager \
          --zone=${{ env.GCP_ZONE }} \
          --ssh-key-expire-after=1h \
          --command="sudo rm -f /etc/apt/sources.list.d/deadsnakes*.list && \
                     sudo apt-get clean && \
                     wget https://bootstrap.pypa.io/get-pip.py -O /tmp/get-pip.py && \
                     if ! command -v python3.11 >/dev/null 2>&1; then \
                       curl -sSL https://raw.githubusercontent.com/pyenv/pyenv-installer/master/bin/pyenv-installer | bash && \
                       export PATH=\"\$HOME/.pyenv/bin:\$PATH\" && \
                       eval \"\$(pyenv init --path)\" && \
                       eval \"\$(pyenv init -)\" && \
                       pyenv install 3.11.8 && \
                       pyenv global 3.11.8 && \
                       sudo ln -sf \$HOME/.pyenv/versions/3.11.8/bin/python3.11 /usr/local/bin/python3.11 && \
                       sudo \$HOME/.pyenv/versions/3.11.8/bin/python3.11 /tmp/get-pip.py; \
                     fi && \
                     python3.11 --version"
        
        echo "Fixing Wazuh configuration errors..."
        gcloud compute ssh wazuh-manager \
          --zone=${{ env.GCP_ZONE }} \
          --ssh-key-expire-after=1h \
          --command="sudo systemctl stop wazuh-manager 2>/dev/null || true && \
                     sudo cp /var/ossec/etc/ossec.conf.backup /var/ossec/etc/ossec.conf 2>/dev/null || true && \
                     sudo sed -i '/<integratord>/,/<\/integratord>/d' /var/ossec/etc/ossec.conf && \
                     sudo sed -i 's/<max_log>50<\/max_log>//g' /var/ossec/etc/ossec.conf && \
                     echo 'Fixed invalid configuration in ossec.conf'"
        
        echo "Starting Wazuh Manager..."
        gcloud compute ssh wazuh-manager \
          --zone=${{ env.GCP_ZONE }} \
          --ssh-key-expire-after=1h \
          --command="sudo systemctl start wazuh-manager && \
                     sleep 20 && \
                     sudo systemctl status wazuh-manager --no-pager"
        
        echo "Creating required .env configuration file..."
        gcloud compute ssh wazuh-manager \
          --zone=${{ env.GCP_ZONE }} \
          --ssh-key-expire-after=1h \
          --command="sudo mkdir -p /etc/wazuh-autopilot && \
                     sudo tee /etc/wazuh-autopilot/.env > /dev/null << 'ENV_EOF'
        AUTOPILOT_MODE=bootstrap
        MCP_API_KEY=${{ secrets.MCP_API_KEY }}
        OPENCLAW_GATEWAY_TOKEN=${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
        OPENCLAW_TOKEN=${{ secrets.OPENCLAW_TOKEN }}
        OPENCLAW_WEBHOOK_TOKEN=${{ secrets.OPENCLAW_WEBHOOK_TOKEN }}
        ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
        OPENCLAW_LLM_MODE=local
        AUTOPILOT_REQUIRE_TAILSCALE=false
        OPENCLAW_GATEWAY_URL=http://127.0.0.1:18789
        MCP_URL=http://localhost:3001
        RUNTIME_PORT=9090
        AUTOPILOT_RESPONDER_ENABLED=false
        AUTOPILOT_DATA_DIR=/var/lib/wazuh-autopilot
        AUTOPILOT_CONFIG_DIR=/etc/wazuh-autopilot
        ENV_EOF"
        
        echo "Executing official OpenClaw Autopilot installer in bootstrap mode..."
        gcloud compute ssh wazuh-manager \
          --zone=${{ env.GCP_ZONE }} \
          --ssh-key-expire-after=1h \
          --command="cd /tmp/wazuh-autopilot && \
                     yes | sudo TERM=xterm timeout 300 ./install/install.sh --mode bootstrap"

    - name: Fix OpenClaw Gateway Configuration
      run: |
        echo "Fixing OpenClaw Gateway for air-gapped deployment..."
        
        # Stop any running OpenClaw service
        gcloud compute ssh wazuh-manager \
          --zone=${{ env.GCP_ZONE }} \
          --ssh-key-expire-after=1h \
          --command="sudo systemctl stop openclaw-gateway 2>/dev/null || true"
        
        # Create airgapped OpenClaw configuration
        gcloud compute ssh wazuh-manager \
          --zone=${{ env.GCP_ZONE }} \
          --ssh-key-expire-after=1h \
          --command='sudo tee /root/.openclaw/openclaw.json > /dev/null << "EOF"
        {
          "gateway": {
            "port": 18789,
            "mode": "local",
            "bind": "lan",
            "auth": {
              "mode": "token",
              "token": "d2502996754e434c8d043743ba85eec3951e8ff3efdf1986"
            },
            "controlUi": {
              "allowedOrigins": ["*"],
              "dangerouslyAllowHostHeaderOriginFallback": true,
              "dangerouslyDisableDeviceAuth": true
            }
          },
          "agents": {
            "defaults": {
              "model": {
                "primary": "ollama/qwen2.5:0.5b"
              }
            },
            "list": [
              {
                "id": "wazuh-triage",
                "name": "Wazuh Alert Triage",
                "default": true,
                "workspace": "/var/lib/openclaw/wazuh-autopilot/agents/triage",
                "agentDir": "/var/lib/openclaw/wazuh-autopilot/agents/triage"
              }
            ]
          },
          "channels": {
            "slack": {
              "enabled": false
            }
          },
          "hooks": {
            "enabled": true,
            "token": "83680fd455b3afa6c662618ce38fbcf5a0b08ecb03daa96a896db55ffc0a78db",
            "path": "/webhook"
          },
          "models": {
            "mode": "replace",
            "providers": {
              "ollama": {
                "baseUrl": "http://localhost:11434",
                "apiKey": "ollama-local",
                "api": "ollama",
                "models": [
                  {
                    "id": "qwen2.5:0.5b",
                    "name": "qwen2.5:0.5b",
                    "contextWindow": 32768,
                    "maxTokens": 8192
                  }
                ]
              }
            }
          }
        }
        EOF'
        
        # Create systemd service for OpenClaw Gateway
        gcloud compute ssh wazuh-manager \
          --zone=${{ env.GCP_ZONE }} \
          --ssh-key-expire-after=1h \
          --command='sudo tee /etc/systemd/system/openclaw-gateway.service > /dev/null << "EOF"
        [Unit]
        Description=OpenClaw Gateway (Air-gapped)
        After=network.target ollama.service

        [Service]
        Type=simple
        User=root
        WorkingDirectory=/var/lib/openclaw
        EnvironmentFile=/etc/wazuh-autopilot/.env
        Environment="OPENCLAW_STATE_DIR=/var/lib/openclaw"
        Environment="OPENCLAW_GATEWAY_TOKEN=d2502996754e434c8d043743ba85eec3951e8ff3efdf1986"
        ExecStart=/usr/bin/openclaw gateway run
        Restart=always
        RestartSec=10

        [Install]
        WantedBy=multi-user.target
        EOF'
        
        # Start OpenClaw Gateway service
        gcloud compute ssh wazuh-manager \
          --zone=${{ env.GCP_ZONE }} \
          --ssh-key-expire-after=1h \
          --command="sudo systemctl daemon-reload && \
                     sudo systemctl enable openclaw-gateway && \
                     sudo systemctl start openclaw-gateway"
        
        echo "OpenClaw Gateway configured and started successfully"

    - name: Output Autopilot Details
      run: |
        VM_IP=$(gcloud compute instances describe wazuh-manager \
          --zone=${{ env.GCP_ZONE }} \
          --format='get(networkInterfaces[0].accessConfigs[0].natIP)')
        
        echo "## Wazuh OpenClaw Autopilot Deployed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### AI Security Operations Dashboard" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**OpenClaw Dashboard:** http://$VM_IP:18789" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Authentication:** Use the \`OPENCLAW_GATEWAY_TOKEN\` repository secret" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**OpenClaw Runtime API:** http://$VM_IP:9090" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- View AI agent sessions and security analysis" >> $GITHUB_STEP_SUMMARY
        echo "- Manage automated incident response" >> $GITHUB_STEP_SUMMARY
        echo "- Approve/reject AI recommendations" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### AI Infrastructure" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Ollama API:** http://$VM_IP:11434" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Local Qwen AI model (qwen2.5:0.5b) - Zero Claude API costs!**" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**MCP Server:** http://$VM_IP:3001" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- AI bridge to Wazuh Manager" >> $GITHUB_STEP_SUMMARY
        echo "- Security data API for AI agents" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Existing Wazuh Infrastructure" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Wazuh Dashboard:** https://$VM_IP" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- Traditional security monitoring" >> $GITHUB_STEP_SUMMARY
        echo "- Raw alerts and agent management" >> $GITHUB_STEP_SUMMARY
