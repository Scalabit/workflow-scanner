name: Release Binary to Docker Hub

on: 
  release:
    types: [published]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write
      
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'
        
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Extract tag name
      shell: bash
      run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
      
    - name: Build and push binary scanner to Docker Hub
      run: |
        # Build for release tag
        docker build -f binary.Dockerfile -t scalabit/workflow-scanner:${{ env.TAG }} .
        docker build -f binary.Dockerfile -t scalabit/workflow-scanner:latest .
        
        # Push to Docker Hub
        docker push scalabit/workflow-scanner:${{ env.TAG }}
        docker push scalabit/workflow-scanner:latest

