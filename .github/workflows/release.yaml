name: Release Binary to Docker Hub

on: 
  release:
    types: [published]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write
      
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        persist-credentials: false
      
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'
        
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Extract tag name
      shell: bash
      run: |
        if [[ "${{ github.event_name }}" == "release" ]]; then
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
        else
          # Use commit SHA for manual triggers
          echo "TAG=${{ github.sha }}" >> $GITHUB_ENV
        fi
      
    - name: Build and push binary scanner to Docker Hub
      run: |
        # Build scanner image
        docker build -f binary.Dockerfile -t mariominhava04/workflow-scanner:latest .
        
        # Push to Docker Hub
        docker push mariominhava04/workflow-scanner:latest
        
        # Also tag with specific version if this is a release
        if [[ "${{ github.event_name }}" == "release" ]]; then
          docker tag mariominhava04/workflow-scanner:latest mariominhava04/workflow-scanner:${TAG}
          docker push mariominhava04/workflow-scanner:${TAG}
        fi

