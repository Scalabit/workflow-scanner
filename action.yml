name: 'Workflow Security Scanner'
description: 'AI agent that analyzes and fixes GitHub workflows'
inputs:
  api-token:
    description: 'API token for workflow scanner service (get from your dashboard)'
    required: true
  github-token:
    description: 'GitHub token with repo permissions'
    required: true
  llm-api-key:
    description: 'LLM API key for AI analysis (OpenAI, Anthropic, or Gemini)'
    required: true
  repository:
    description: 'Repository in format owner/repo'
    required: false
    default: ${{ github.repository }}
outputs:
  pr-url:
    description: 'URL of the created pull request'
runs:
  using: 'composite'
  steps:
    - name: Run Dagger workflow scanner
      uses: dagger/dagger-for-github@v6
      with:
        version: "v0.19.6"
        verb: call
        args: scan-and-fix-workflows --api-token=env:API_TOKEN --github-token=env:GITHUB_TOKEN --repository=${{ inputs.repository }} --source=.
      env:
        API_TOKEN: ${{ inputs.api-token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        OPENAI_API_KEY: ${{ inputs.llm-api-key }}
        ANTHROPIC_API_KEY: ${{ inputs.llm-api-key }}
        GEMINI_API_KEY: ${{ inputs.llm-api-key }}