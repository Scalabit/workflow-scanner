name: 'Workflow Security Scanner'
description: 'AI agent that analyzes and fixes GitHub workflows'
inputs:
  github-token:
    description: 'GitHub token with repo permissions'
    required: true
  repository:
    description: 'Repository in format owner/repo'
    required: true
  dagger-module:
    description: 'Path to dagger module'
    required: false
    default: 'dagger'
outputs:
  pr-url:
    description: 'URL of the created pull request'
runs:
  using: 'composite'
  steps:
    - name: Run Dagger workflow scanner
      uses: dagger/dagger-for-github@v6
      with:
        version: "latest"
        verb: call
        module: ${{ github.action_path }}/dagger
        args: scan-and-fix-workflows --github-token=env:GITHUB_TOKEN --repository=${{ inputs.repository }} --source=.
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}